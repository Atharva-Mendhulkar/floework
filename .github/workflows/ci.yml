name: Floework CI - Automated Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: API Behavioral Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Web Application Bundle
        run: npm --prefix apps/web run build

      - name: Run API Behavioral Suite
        run: ./node_modules/.bin/vitest run test/api/
        env:
          NODE_ENV: test
          AWS_REGION: us-east-1

      - name: Verify Cutover Delta Sync Engine (--dry-run)
        run: node scripts/cutover_delta_sync.mjs --dry-run
        env:
          DRY_RUN: 'true'

      - name: Verify Database Migrations (--dry-run)
        run: npm run migrate:dry-run

      - name: Verify Disaster Recovery Readiness (--dry-run)
        run: npm run dr:dry-run

      - name: Verify Security & Compliance Audit (--dry-run)
        run: npm run compliance:dry-run

  frontend-tests:
    name: Frontend React Vitest & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Component & Unit Tests
        run: ./node_modules/.bin/vitest run --root apps/web

      - name: Compile Production Web Application Bundle
        run: npm --prefix apps/web run build
