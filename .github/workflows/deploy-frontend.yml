name: Frontend React SPA Build & CloudFront Delivery

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_BUCKET: floework-staging-frontend-us-east-1

jobs:
  build-and-deploy:
    name: Build React SPA, Sync S3 & Invalidate CDN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: ./node_modules/.bin/vitest run --root apps/web

      - name: Compile Production Web Application Bundle
        run: npm --prefix apps/web run build

      - name: Configure AWS Credentials via OIDC
        id: aws-auth
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-FrontendDeploy
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy Immutable Static Assets to S3
        id: sync-assets
        if: steps.aws-auth.outcome == 'success'
        run: |
          aws s3 sync apps/web/dist/assets s3://${{ env.FRONTEND_BUCKET }}/assets \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy HTML & Entrypoints to S3
        id: sync-html
        if: steps.aws-auth.outcome == 'success'
        run: |
          aws s3 sync apps/web/dist s3://${{ env.FRONTEND_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront CDN Edge Cache
        id: invalidate
        if: steps.aws-auth.outcome == 'success' && env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Publish Deployment Summary to GitHub Step Summary
        run: |
          echo "## 🚀 Frontend React SPA Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target S3 Bucket** | \`${{ env.FRONTEND_BUCKET }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Assets Cache-Control** | \`public, max-age=31536000, immutable\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **HTML Cache-Control** | \`public, max-age=0, must-revalidate\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle Dist Directory** | \`apps/web/dist/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **OIDC Auth Status** | \`${{ steps.aws-auth.outcome || 'skipped (no role configured)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **S3 Sync Status** | \`${{ steps.sync-html.outcome || 'skipped' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFront Invalidation** | \`${{ steps.invalidate.outcome || 'skipped' }}\` |" >> $GITHUB_STEP_SUMMARY
