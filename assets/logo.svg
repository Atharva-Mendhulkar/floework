<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Liquid Glass Drop Shadow Filter -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#007dff" flood-opacity="0.15" />
    </filter>

    <!-- Liquid Specular Refraction Glow Filter -->
    <filter id="liquid-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Surface Gradient (Multi-stop translucent frost) -->
    <linearGradient id="glass-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f8fafc" stop-opacity="0.82" />
      <stop offset="70%" stop-color="#eef2f6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.88" />
    </linearGradient>

    <!-- Liquid Glass Outer Border Gradient -->
    <linearGradient id="liquid-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#007dff" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Specular Highlight Top Rim (Lens curvature reflection) -->
    <linearGradient id="specular-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Electric Focus Dot Gradient -->
    <radialGradient id="electric-dot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#007dff" />
      <stop offset="100%" stop-color="#0056b3" />
    </radialGradient>

    <!-- Ambient Refractive Sheen -->
    <linearGradient id="refractive-sheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#007dff" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Base Shadow & Glass Body -->
  <rect x="8" y="8" width="112" height="112" rx="28" 
        fill="url(#glass-surface)" 
        filter="url(#glass-shadow)" />

  <!-- Liquid Ambient Sheen Overlay -->
  <rect x="8" y="8" width="112" height="112" rx="28" 
        fill="url(#refractive-sheen)" />

  <!-- Curved Specular Light Reflection (Top Liquid Lens) -->
  <path d="M 12 36 C 12 20, 20 12, 36 12 L 92 12 C 108 12, 116 20, 116 36 C 116 30, 96 24, 64 24 C 32 24, 12 30, 12 36 Z" 
        fill="url(#specular-highlight)" 
        opacity="0.75" />

  <!-- Outer Liquid Glass Prism Border -->
  <rect x="8" y="8" width="112" height="112" rx="28" 
        fill="none" 
        stroke="url(#liquid-border)" 
        stroke-width="2.5" />

  <!-- Inner Soft Bevel Rim -->
  <rect x="10.5" y="10.5" width="107" height="107" rx="26" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        stroke-opacity="0.8" />

  <!-- Typography "f" with subtle depth -->
  <text x="25" y="96"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="104"
        letter-spacing="-0.04em"
        fill="#090d16">
    f
  </text>

  <!-- Liquid Focus Indicator Dot (Glowing cyan-blue sapphire) -->
  <circle cx="84" cy="94" r="12" fill="url(#electric-dot)" filter="url(#liquid-glow)" />
  
  <!-- Dot Specular Pinpoint Highlight -->
  <ellipse cx="80.5" cy="89.5" rx="3.5" ry="2" fill="#ffffff" opacity="0.85" />
</svg>